services:
  - type: web
    name: trade-erp-test
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trade-erp-test-db
          property: connectionString
      - key: ERP_SECRET_KEY
        generateValue: true
      - key: ERP_ADMIN_PASSWORD
        sync: false
      - key: ERP_HTTPS_ONLY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.7"

databases:
  - name: trade-erp-test-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "18"
    databaseName: trade_erp_test
    user: trade_erp_test
